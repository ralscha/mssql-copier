# Sample configuration for mssql-copier.
# Copy this file to mssql-copier.yml and adjust values for your environment.

source: sqlserver://user:pass@source-host:1433?database=SourceDB
target: sqlserver://user:pass@target-host:1433?database=TargetDB

workers: 8
batch-size: 10000
verbose: true
plan: false
drop-existing: false

include-schemas:
  - sales
  - reporting
exclude-schemas:
  - audit

include-tables:
  - sales.orders
  - sales.customers
exclude-tables:
  - "*.audit_%"

# TUI-managed fake-data mappings are stored separately in
# .mssql-copier/fake-data-mapping.yml and keyed by the source DSN.
# If you want to define fake-data mappings manually, you can still add a
# fake-data: block here, but the TUI will not export those mappings back into
# this file.
#
# fake-data:
#   users.name: Name
#   email: Email
#   name.*: FirstName
#   summary: LoremIpsumSentence;10
#   amount: Price;1;100

# Optional LLM config for TUI fake-data auto-selection.
# The TUI only shows the auto-select action when this block is present and
# the referenced API key is available in the environment.
# The TUI can also export its current form state back into a YAML file.
# llm:
#   provider: openai
#   model: gpt-4o-mini
#   api-key-env: OPENAI_API_KEY
#   base-url: https://api.openai.com/v1
