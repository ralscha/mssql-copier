version: 3

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  format:
    desc: Format Go code
    cmds:
      - go fix ./...
      - go fmt ./...

  build:
    desc: Build the copier binary
    deps: [format]
    cmds:
      - go build ./cmd/mssql-copier

  lint:
    desc: Run golangci-lint in a Docker container
    cmds:
      - docker run --rm -v {{toSlash .ROOT_DIR}}:/app -w /app golangci/golangci-lint:v2.13.1 golangci-lint run -v --timeout 5m

  test:
    desc: Run all tests
    cmds:
      - go test -v ./...

  test:integration:
    desc: Run the testcontainers-backed integration test
    deps: [format]
    cmds:
      - go test -run TestCopierIntegration ./...
    env:
      COPY_MSSQL_RUN_INTEGRATION: '1'

  test:integration:verbose:
    desc: Run the testcontainers-backed integration test with verbose output
    deps: [format]
    cmds:
      - go test -v -run TestCopierIntegration ./...
    env:
      COPY_MSSQL_RUN_INTEGRATION: '1'

  test:portable:
    desc: Run the end-to-end portable Docker bundle and restore test
    cmds:
      - go test -v -run ^TestPortableDockerBundleIntegration$ -count=1 -timeout 15m ./internal/copier
    env:
      COPY_MSSQL_RUN_PORTABLE_INTEGRATION: '1'

  plan:
    desc: Launch the app with a config that preselects plan mode in the TUI
    deps: [build]
    summary: |
      Open the TUI using a YAML config file that already has `plan: true`
      plus any source/filter settings you want to inspect.
    cmds:
      - go run ./cmd/mssql-copier --config "{{.CONFIG}}"
    requires:
      vars: [CONFIG]

  run:
    desc: Launch the TUI
    deps: [build]
    summary: |
      Open the TUI, optionally preloading values from a YAML config file.

      Examples:
        task run
        task run CONFIG=./mssql-copier.yml
    cmds:
      - go run ./cmd/mssql-copier {{if .CONFIG}}--config "{{.CONFIG}}"{{end}}

  tui:
    desc: Launch the TUI
    cmds:
      - task: run
        vars:
          CONFIG: '{{.CONFIG}}'

  dev:db:up:
    desc: Start the development SQL Server with Northwind sample data
    dir: docker/dev
    cmds:
      - docker compose up -d

  dev:db:down:
    desc: Stop the development SQL Server (data volume is preserved)
    dir: docker/dev
    cmds:
      - docker compose down

  dev:db:reset:
    desc: Stop the development SQL Server and delete all data
    dir: docker/dev
    cmds:
      - docker compose down --volumes

  clean:
    desc: Remove the built executable if present
    cmds:
      - cmd /c "if exist mssql-copier.exe del /q mssql-copier.exe"

  tag:
    desc: Create a local git tag for a release
    summary: |
      Create a local git tag.

      Run with `task --interactive tag` to be prompted for TAG,
      or pass it explicitly with `task tag TAG=v1.0.0`.
    requires:
      vars: [TAG]
    preconditions:
      - sh: 'case "{{.TAG}}" in v*) exit 0 ;; *) exit 1 ;; esac'
        msg: TAG must start with v, for example v1.0.0
      - sh: 'if git rev-parse -q --verify "refs/tags/{{.TAG}}" >/dev/null 2>&1; then exit 1; fi; exit 0'
        msg: Tag already exists locally
    cmds:
      - git tag {{.TAG}}

  push-tag:
    desc: Push an existing git tag to GitHub
    summary: |
      Push a git tag to the origin remote.

      Run with `task --interactive push-tag` to be prompted for TAG,
      or pass it explicitly with `task push-tag TAG=v1.0.0`.
    requires:
      vars: [TAG]
    preconditions:
      - sh: 'case "{{.TAG}}" in v*) exit 0 ;; *) exit 1 ;; esac'
        msg: TAG must start with v, for example v1.0.0
      - sh: 'if git rev-parse -q --verify "refs/tags/{{.TAG}}" >/dev/null 2>&1; then exit 0; else exit 1; fi'
        msg: Tag does not exist locally. Run `task tag TAG=v1.0.0` first.
    cmds:
      - git push origin {{.TAG}}

  release-tag:
    desc: Create and push a release tag to GitHub
    summary: |
      Create a local git tag and push it to the origin remote.

      Run with `task --interactive release-tag` to be prompted for TAG,
      or pass it explicitly with `task release-tag TAG=v1.0.0`.
    requires:
      vars: [TAG]
    preconditions:
      - sh: 'case "{{.TAG}}" in v*) exit 0 ;; *) exit 1 ;; esac'
        msg: TAG must start with v, for example v1.0.0
      - sh: 'if git rev-parse -q --verify "refs/tags/{{.TAG}}" >/dev/null 2>&1; then exit 1; fi; exit 0'
        msg: Tag already exists locally
    cmds:
      - git tag {{.TAG}}
      - git push origin {{.TAG}}
