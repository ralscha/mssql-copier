version: 3

vars:
  GOMODCACHE:
    sh: go env GOMODCACHE
  GOCACHE:
    sh: go env GOCACHE

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  format:
    desc: Format Go code
    cmds:
      - go fix ./...
      - go fmt ./...

  build:
    desc: Build the copier binary
    deps: [format]
    cmds:
      - go build ./cmd/mssql-copier

  lint:
    desc: Run golangci-lint in a Docker container
    cmds:
      - go mod download
      - docker run --rm -e GOMODCACHE=/go/pkg/mod -e GOCACHE=/root/.cache/go-build -v {{toSlash .ROOT_DIR}}:/app -v {{toSlash .GOMODCACHE}}:/go/pkg/mod -v {{toSlash .GOCACHE}}:/root/.cache/go-build -w /app golangci/golangci-lint:v2.11.4 golangci-lint run -v --timeout 5m

  test:
    desc: Run all tests
    cmds:
      - go test -v ./...

  test:integration:
    desc: Run the testcontainers-backed integration test
    deps: [format]
    cmds:
      - go test -run TestCopierIntegration ./...
    env:
      COPY_MSSQL_RUN_INTEGRATION: '1'

  test:integration:verbose:
    desc: Run the testcontainers-backed integration test with verbose output
    deps: [format]
    cmds:
      - go test -v -run TestCopierIntegration ./...
    env:
      COPY_MSSQL_RUN_INTEGRATION: '1'

  plan:
    desc: Print the execution plan without modifying the target
    deps: [build]
    cmds:
      - go run ./cmd/mssql-copier -plan -source "{{.SOURCE_DSN}}" {{if .TARGET_DSN}}-target "{{.TARGET_DSN}}"{{end}} {{if .INCLUDE_SCHEMAS}}-include-schemas "{{.INCLUDE_SCHEMAS}}"{{end}} {{if .EXCLUDE_SCHEMAS}}-exclude-schemas "{{.EXCLUDE_SCHEMAS}}"{{end}} {{if .INCLUDE_TABLES}}-include-tables "{{.INCLUDE_TABLES}}"{{end}} {{if .EXCLUDE_TABLES}}-exclude-tables "{{.EXCLUDE_TABLES}}"{{end}} {{if .DROP_EXISTING}}-drop-existing{{end}}
    requires:
      vars: [SOURCE_DSN]

  run:
    desc: Run the copier
    deps: [build]
    cmds:
      - go run ./cmd/mssql-copier -source "{{.SOURCE_DSN}}" -target "{{.TARGET_DSN}}" {{if .INCLUDE_SCHEMAS}}-include-schemas "{{.INCLUDE_SCHEMAS}}"{{end}} {{if .EXCLUDE_SCHEMAS}}-exclude-schemas "{{.EXCLUDE_SCHEMAS}}"{{end}} {{if .INCLUDE_TABLES}}-include-tables "{{.INCLUDE_TABLES}}"{{end}} {{if .EXCLUDE_TABLES}}-exclude-tables "{{.EXCLUDE_TABLES}}"{{end}} {{if .DROP_EXISTING}}-drop-existing{{end}} {{if .WORKERS}}-workers {{.WORKERS}}{{end}} {{if .BATCH_SIZE}}-batch-size {{.BATCH_SIZE}}{{end}}
    requires:
      vars: [SOURCE_DSN, TARGET_DSN]

  clean:
    desc: Remove the built executable if present
    cmds:
      - cmd /c "if exist mssql-copier.exe del /q mssql-copier.exe"

  tag:
    desc: Create a local git tag for a release
    summary: |
      Create a local git tag.

      Run with `task --interactive tag` to be prompted for TAG,
      or pass it explicitly with `task tag TAG=v1.0.0`.
    requires:
      vars: [TAG]
    preconditions:
      - sh: 'case "{{.TAG}}" in v*) exit 0 ;; *) exit 1 ;; esac'
        msg: TAG must start with v, for example v1.0.0
      - sh: 'if git rev-parse -q --verify "refs/tags/{{.TAG}}" >/dev/null 2>&1; then exit 1; fi; exit 0'
        msg: Tag already exists locally
    cmds:
      - git tag {{.TAG}}

  push-tag:
    desc: Push an existing git tag to GitHub
    summary: |
      Push a git tag to the origin remote.

      Run with `task --interactive push-tag` to be prompted for TAG,
      or pass it explicitly with `task push-tag TAG=v1.0.0`.
    requires:
      vars: [TAG]
    preconditions:
      - sh: 'case "{{.TAG}}" in v*) exit 0 ;; *) exit 1 ;; esac'
        msg: TAG must start with v, for example v1.0.0
      - sh: 'if git rev-parse -q --verify "refs/tags/{{.TAG}}" >/dev/null 2>&1; then exit 0; else exit 1; fi'
        msg: Tag does not exist locally. Run `task tag TAG=v1.0.0` first.
    cmds:
      - git push origin {{.TAG}}

  release-tag:
    desc: Create and push a release tag to GitHub
    summary: |
      Create a local git tag and push it to the origin remote.

      Run with `task --interactive release-tag` to be prompted for TAG,
      or pass it explicitly with `task release-tag TAG=v1.0.0`.
    requires:
      vars: [TAG]
    preconditions:
      - sh: 'case "{{.TAG}}" in v*) exit 0 ;; *) exit 1 ;; esac'
        msg: TAG must start with v, for example v1.0.0
      - sh: 'if git rev-parse -q --verify "refs/tags/{{.TAG}}" >/dev/null 2>&1; then exit 1; fi; exit 0'
        msg: Tag already exists locally
    cmds:
      - git tag {{.TAG}}
      - git push origin {{.TAG}}