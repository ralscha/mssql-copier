name: SQL Server Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run SQL Server integration tests
        env:
          COPY_MSSQL_RUN_INTEGRATION: '1'
        run: go test -v -count=1 -run 'Test(CopierIntegration|EnsureTargetDatabase)' ./internal/copier
